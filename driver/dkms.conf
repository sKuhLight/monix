PACKAGE_NAME="audient_id"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="audient_id"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
# Build through the module's own Makefile so its Clang/GCC auto-detection runs
# (CachyOS/Arch kernels are Clang-built, stock Arch and most others are GCC).
# LLVM=1 must NOT be hardcoded here: kbuild then passes GCC-only flags to clang
# and the build dies with "unknown argument: '-mpreferred-stack-boundary=3'".
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KDIR=${kernel_source_dir}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean KDIR=${kernel_source_dir}"
